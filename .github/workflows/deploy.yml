name: Deploy Worker & Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install worker dependencies
        run: |
          cd worker
          npm install

      - name: Deploy Worker
        run: |
          cd worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: de9cc5da9705c7edf34e7e4e0ac9e360

  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build with next-on-pages
        run: npx @cloudflare/next-on-pages

      - name: Deploy Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=uptimeflare --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: de9cc5da9705c7edf34e7e4e0ac9e360
